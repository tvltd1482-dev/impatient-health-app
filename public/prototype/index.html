<script>
  // Shim Claude Design's window.claude.complete so Coach works in this host.
  // /api/generate streams from claude-haiku-4-5 via SSE. Callers can pass
  // an onChunk callback to render tokens as they arrive; the promise still
  // resolves to the full text once the stream completes.
  window.claude = window.claude || {
    complete: async ({ messages, onChunk }) => {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      if (!res.ok || !res.body) {
        throw new Error("generate failed: " + res.status);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = "";
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";
        for (const raw of lines) {
          if (!raw.startsWith("data: ")) continue;
          const payload = JSON.parse(raw.slice(6));
          if (payload.error) throw new Error(payload.error);
          if (payload.delta) {
            full += payload.delta;
            onChunk && onChunk(payload.delta);
          }
        }
      }
      return full;
    },
  };
</script>

<script type="text/babel" data-presets="react" data-screen-label="00 App">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "persona": "renee",
  "textScale": 1,
  "onboardingFlow": "deep-cold",
  "onboardingTone": "literary"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = useState("today");

  // expose persona so TodayPage reads it
  window.__activePersona = tweaks.persona;

  // Drive the global type scale via a CSS custom property.
  // The tokens.css scale multiplies through this — every size in the app
  // recalculates without us touching individual rules.
  React.useEffect(() => {
    document.documentElement.style.setProperty("--text-scale", tweaks.textScale ?? 1);
  }, [tweaks.textScale]);
  const labels = {
    today: "Today",
    foresight: "Foresight",
    coach: "Coach",
    admin: "Admin queue",
    travel: "Travel Card",
    cost: "Cost of Care",
    concierge: "Appointment Concierge",
    patterns: "Patterns",
    conditions: "Conditions library",
    care: "Care directory",
    integrations: "Integrations",
    profile: "Profile",
    settings: "Settings",
    onboarding: "Onboarding · preview",
  };

  const activePersona = window.PERSONAS[tweaks.persona];
  const activeTier = activePersona?.tier || "Free";
  const routeLocked = window.isLockedAtTier(page, activeTier);

  return (
    <div className="app">
      <AuraBackdrop />
      <Sidebar current={page} onNav={setPage} persona={activePersona} />
      <main className="main">
        <Topbar crumb={labels[page]} persona={activePersona} />
        {routeLocked ? <TierLocked surface={page} key={tweaks.persona + ":" + page} />
         : page === "today" ? <TodayPage key={tweaks.persona} />
         : page === "coach" ? <CoachPage key={tweaks.persona} />
         : page === "patterns" ? <PatternsPage key={tweaks.persona} />
         : page === "concierge" ? <ConciergePage key={tweaks.persona} />
         : page === "profile" ? <ProfilePage key={tweaks.persona} />
         : page === "integrations" ? <IntegrationsPage key={tweaks.persona} />
         : page === "onboarding" ? <OnboardingPreviewPage flow={tweaks.onboardingFlow} tone={tweaks.onboardingTone} onExit={() => setPage("today")} />
         : <ComingSoon name={labels[page]} />}
      </main>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Persona · same engine, three lives">
          <div className="persona-pick">
            {Object.values(window.PERSONAS).map(p => (
              <button
                key={p.id}
                className={"persona-pick-btn" + (tweaks.persona === p.id ? " active" : "")}
                onClick={() => setTweak('persona', p.id)}
              >
                <div className="persona-pick-tier">{p.tier} · {p.archetype}</div>
                <div className="persona-pick-name">{p.name}, {p.age} · {p.locationStr}</div>
                <div className="persona-pick-arch">{p.role}</div>
              </button>
            ))}
          </div>
        </TweakSection>
        <TweakSection label="Text size · accessibility">
          <div className="text-scale-pick">
            {[
              { v: 0.92, label: "Compact",  hint: "denser overview" },
              { v: 1.00, label: "Default",  hint: "comfortable" },
              { v: 1.15, label: "Larger",   hint: "easier on flare days" },
              { v: 1.30, label: "Largest",  hint: "low-vision friendly" },
            ].map(opt => (
              <button
                key={opt.v}
                className={"text-scale-btn" + (tweaks.textScale === opt.v ? " active" : "")}
                onClick={() => setTweak('textScale', opt.v)}
              >
                <span className="text-scale-sample" style={{ fontSize: `calc(20px * ${opt.v})` }}>Aa</span>
                <span className="text-scale-label">{opt.label}</span>
                <span className="text-scale-hint">{opt.hint}</span>
              </button>
            ))}
          </div>
        </TweakSection>
        {page === "onboarding" && (
          <>
            <TweakSection label="Onboarding · flow">
              <div className="ob-tweak-pick">
                {[
                  { v: "lean",            label: "Lean · 5 screens",  hint: "downloaded on a flare day" },
                  { v: "deep-cold",       label: "Deep · cold",        hint: "just downloaded" },
                  { v: "deep-clinician",  label: "Deep · clinician",   hint: "doctor invited them" },
                  { v: "deep-community",  label: "Deep · community",   hint: "friend shared" },
                ].map(opt => (
                  <button
                    key={opt.v}
                    className={"ob-tweak-btn" + (tweaks.onboardingFlow === opt.v ? " active" : "")}
                    onClick={() => setTweak('onboardingFlow', opt.v)}
                  >
                    <span className="ob-tweak-label">{opt.label}</span>
                    <span className="ob-tweak-hint">{opt.hint}</span>
                  </button>
                ))}
              </div>
            </TweakSection>
            <TweakSection label="Onboarding · tonal pitch">
              <div className="ob-tweak-pick">
                {[
                  { v: "literary",   label: "Literary",   hint: "slow, validating" },
                  { v: "validating", label: "Validating", hint: "direct, specific" },
                  { v: "clinical",   label: "Clinical",   hint: "brisk, professional" },
                ].map(opt => (
                  <button
                    key={opt.v}
                    className={"ob-tweak-btn" + (tweaks.onboardingTone === opt.v ? " active" : "")}
                    onClick={() => setTweak('onboardingTone', opt.v)}
                  >
                    <span className="ob-tweak-label">{opt.label}</span>
                    <span className="ob-tweak-hint">{opt.hint}</span>
                  </button>
                ))}
              </div>
            </TweakSection>
          </>
        )}
      </TweaksPanel>
    </div>
  );
}

/* OnboardingPreviewPage — renders the handoff flow inside a phone-shaped
   bezel so designers can review against the source canvas. The flow type
   and tonal pitch come from Tweaks. In production the user lands here
   once on first install; FirstReadScreen.onFinish routes back to /today. */
function OnboardingPreviewPage({ flow, tone, onExit }) {
  const Flow = flow === "lean" ? window.LeanFlow : window.DeepFlow;
  const entry =
    flow === "deep-clinician" ? "clinician" :
    flow === "deep-community" ? "community" :
    "cold";
  // Remount when flow/tone/entry changes — FlowShell holds idx in local
  // state, and we want a fresh sequence when the previewer picks a new
  // variant. The composite key forces React to discard the prior tree.
  const key = `${flow}:${tone}:${entry}`;
  return (
    <div className="ob-preview-page">
      <div className="ob-preview-bezel">
        {flow === "lean"
          ? <window.LeanFlow key={key} tone={tone} />
          : <window.DeepFlow key={key} tone={tone} entry={entry} />}
      </div>
    </div>
  );
}

function ComingSoon({ name }) {
  return (
    <div className="page">
      <div className="page-head">
        <div>
          <div className="eyebrow">Next up</div>
          <h1 className="page-title">{name} <em>· in design</em></h1>
        </div>
      </div>
      <div className="card" style={{ padding: 48, textAlign: "center" }}>
        <div className="eyebrow" style={{ marginBottom: 8 }}>Placeholder</div>
        <div style={{ color: "var(--ink-7)" }}>This screen is queued. Comment on Today to direct what comes next.</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
